[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-fips-check"
version = "0.1.0"
description = "FIPS 203/204 boundary validator and hybrid key exchange (X25519 + ML-KEM-768) with ML-DSA-65 signatures and CBOM reporting."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "pqc", "fips-203", "fips-204", "ml-kem", "ml-dsa", "cnsa", "boundary-validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["cryptography", "liboqs-python", "cryptography", "liboqs-python"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/PQBlocks/fips-boundary-validator"
Documentation = "https://github.com/PQBlocks/fips-boundary-validator#readme"
Source = "https://github.com/PQBlocks/fips-boundary-validator"
Changelog = "https://github.com/PQBlocks/fips-boundary-validator/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/fips-boundary-validator/issues"
Security = "https://github.com/PQBlocks/fips-boundary-validator/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
